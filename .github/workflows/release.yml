name: Release

# Publishes @pantechdynamic/sdk to npm, with provenance, when a tag such as
# v0.1.0 is pushed. auto-release.yml calls it directly (a tag pushed with
# GITHUB_TOKEN cannot trigger this workflow itself).

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: The tag to release, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci

      - name: Check the tag matches the package version
        shell: bash
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          package="v$(node -p "require('./package.json').version")"
          if [ "$package" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json ($package)."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node test/smoke.mjs

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          number="${TAG#v}"
          # The CHANGELOG section for this version, up to the next heading.
          awk -v v="$number" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
