# Pending endpoints for instance Dynamic IP (address rotation).
# Merged only where spec/public-api.yaml lacks the route or schema; delete once
# the published spec includes them.
paths:
  /public/v1/instances/{instance_id}/address-rotation:
    get:
      tags:
        - Instances
      summary: "Get an instance's dynamic IP"
      description: |-
        Whether the instance's dynamic IP is on, on what schedule, the address it has now, when it changes next, and its recent changes (`events`, newest first).

        Dynamic IP adds a surcharge to the instance's hourly price while it is on: `every_12_hours` +60 %, `daily` +50 %, `weekly` +40 %, `monthly` +30 %, and +95 % while rotate now (`on_demand`) is on. `surcharge_percent` shows the rate that applies.

        **Scope:** `read`.
      operationId: getInstanceAddressRotation
      security:
        - apiKey: []
      x-scope: read
      parameters:
        - name: instance_id
          in: path
          required: true
          description: "The resource's id."
          schema:
            type: string
      responses:
        200:
          description: The dynamic IP state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressRotation"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `RESOURCE_NOT_FOUND`: no instance with this id in your organization, or the id is not an instance id (`vm_…`). Check the id.
            `ADDRESS_ROTATION_NOT_FOUND`: this instance does not have a dynamic IP. Turn dynamic IP on with `PUT` on this path.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `ADDRESS_ROTATION_UNAVAILABLE`: dynamic IPs are not available yet. Try again later.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
        - Instances
      summary: "Turn on or change dynamic IP"
      description: |-
        Turns on dynamic IP for the instance, or changes its settings. Outbound traffic leaves from a dynamic IP that changes on each rotation.

        `schedule` is `every_12_hours`, `daily`, `weekly` or `monthly`. `connections` is `keep` (default: open connections keep the old address until they close) or `move` (they move to the new address at once). `on_demand: true` allows `POST …/address-rotation/rotate`, up to 10 times a day, where your organization has rotate now enabled.

        Dynamic IP adds a surcharge to the instance's hourly price while it is on: `every_12_hours` +60 %, `daily` +50 %, `weekly` +40 %, `monthly` +30 %, and +95 % while rotate now (`on_demand`) is on. `surcharge_percent` shows the rate that applies.

        Returns `201` when dynamic IP was turned on (`state` is `enabling` until the first address is ready) and `200` when settings changed.

        **Scope:** `write`.
      operationId: putInstanceAddressRotation
      security:
        - apiKey: []
      x-scope: write
      parameters:
        - name: instance_id
          in: path
          required: true
          description: "The resource's id."
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAddressRotationRequest"
      responses:
        200:
          description: The updated dynamic IP settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressRotation"
        201:
          description: Dynamic IP was turned on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressRotation"
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented for this endpoint.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          description: |-
            `FORBIDDEN`: the member who created this key may not change this instance.
            `ADDRESS_ROTATION_NOT_ENABLED`: dynamic IPs are in closed beta and not enabled for your organization yet. Contact support to request access. A dynamic IP that is already on can still be changed and turned off.
            `ADDRESS_ROTATION_ON_DEMAND_OFF`: rotate now is not enabled for this instance or your organization. Contact support to enable it for your organization, then set `on_demand: true`.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        404:
          description: |-
            `RESOURCE_NOT_FOUND`: no instance with this id in your organization, or the id is not an instance id (`vm_…`). Check the id.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        409:
          description: |-
            `ADDRESS_ROTATION_BUSY`: dynamic IP is turning on or off for this instance. Wait for it to finish and try again.
            `ADDRESS_ROTATION_NEEDS_AGENT`: the instance has no running Pantech agent (version 0.5.0 or later). Install the agent and keep it running, then turn dynamic IP on.
            `ADDRESS_ROTATION_NEEDS_PRIVATE_NETWORK`: the instance is not on the private network. Attach it, then turn dynamic IP on.
            `ADDRESS_ROTATION_NO_ADDRESS`: no dynamic IP is free in the instance's location right now. Try again later.
            `ADDRESS_ROTATION_UNAVAILABLE`: dynamic IPs are not available for this instance yet.
            `INSTANCE_NOT_RUNNING`: the instance is not running. Start it, then turn dynamic IP on.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        413:
          description: |-
            `REQUEST_TOO_LARGE`: the body is larger than 64 KiB. Send a smaller request.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        422:
          description: |-
            `VALIDATION_FAILED`: `schedule` must be `every_12_hours`, `daily`, `weekly` or `monthly`, and `connections` `keep` or `move`.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `ADDRESS_ROTATION_UNAVAILABLE`: dynamic IPs are not available yet. Try again later.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
        - Instances
      summary: "Turn off dynamic IP"
      description: |-
        Turns off dynamic IP for the instance and ends the surcharge. Turning dynamic IP back on gives the instance a new address.

        **Scope:** `write`; an AI app's key also needs `delete`.
      operationId: deleteInstanceAddressRotation
      security:
        - apiKey: []
      x-scope: write
      x-destructive: true
      parameters:
        - name: instance_id
          in: path
          required: true
          description: "The resource's id."
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: The dynamic IP state, now `disabling` or `off`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressRotation"
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `RESOURCE_NOT_FOUND`: no instance with this id in your organization, or the id is not an instance id (`vm_…`). Check the id.
            `ADDRESS_ROTATION_NOT_FOUND`: this instance does not have a dynamic IP. Turn dynamic IP on with `PUT` on this path.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `ADDRESS_ROTATION_UNAVAILABLE`: dynamic IPs are not available yet. Try again later.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/instances/{instance_id}/address-rotation/rotate:
    post:
      tags:
        - Instances
      summary: "Rotate the dynamic IP now"
      description: |-
        Gives the instance a new dynamic IP now, outside its schedule. Needs `on_demand: true` on the dynamic IP and rotate now enabled for your organization. Up to 10 per instance in any 24 hours.

        **Scope:** `write`.
      operationId: rotateInstanceAddressNow
      security:
        - apiKey: []
      x-scope: write
      parameters:
        - name: instance_id
          in: path
          required: true
          description: "The resource's id."
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        200:
          description: The dynamic IP with its new address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressRotation"
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          description: |-
            `FORBIDDEN`: the member who created this key may not change this instance.
            `ADDRESS_ROTATION_ON_DEMAND_OFF`: rotate now is not enabled for this instance or your organization. Contact support to enable it for your organization, then set `on_demand: true`.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        404:
          description: |-
            `RESOURCE_NOT_FOUND`: no instance with this id in your organization, or the id is not an instance id (`vm_…`). Check the id.
            `ADDRESS_ROTATION_NOT_FOUND`: this instance does not have a dynamic IP. Turn dynamic IP on with `PUT` on this path.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        409:
          description: |-
            `ADDRESS_ROTATION_BUSY`: dynamic IP is turning on or off for this instance. Wait for it to finish and try again.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          description: |-
            `RATE_LIMITED`: too many requests with this key. Wait for `Retry-After` seconds.
            `ADDRESS_ROTATION_LIMIT_REACHED`: this instance has used its 10 rotate-now changes in the last 24 hours. Try again later.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        503:
          description: |-
            `ADDRESS_ROTATION_UNAVAILABLE`: dynamic IPs are not available yet. Try again later.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    PutAddressRotationRequest:
      type: object
      additionalProperties: false
      required:
        - schedule
      properties:
        schedule:
          type: string
          description: "How often the dynamic IP changes."
          enum:
            - every_12_hours
            - daily
            - weekly
            - monthly
        connections:
          type: string
          description: "`keep` (default): open connections keep the old address until they close. `move`: they move to the new address at once."
          enum:
            - keep
            - move
        on_demand:
          type: boolean
          description: "Allow rotate now. Needs it enabled for your organization."
    AddressRotation:
      type: object
      required:
        - instance_id
        - schedule
        - connections
        - on_demand
        - state
        - surcharge_percent
        - on_demand_used
        - on_demand_limit
        - events
      properties:
        instance_id:
          type: string
        schedule:
          type: string
          enum:
            - every_12_hours
            - daily
            - weekly
            - monthly
        connections:
          type: string
          enum:
            - keep
            - move
        on_demand:
          type: boolean
          description: "Whether rotate now is allowed."
        state:
          type: string
          description: "`enabling` until the first dynamic IP is ready, `active`, `degraded` (dynamic IP is on with reduced capacity, or unreachable so the instance uses its own address until it is restored; see `failure_reason`), `disabling`, `off`, or `failed` (see `failure_reason`)."
          enum:
            - enabling
            - active
            - degraded
            - disabling
            - "off"
            - failed
        current_address:
          type:
            - string
            - "null"
          description: "The dynamic IP the instance uses now. Null before the first one is ready, and while the instance uses its own address (`degraded`)."
        next_rotation_at:
          type:
            - string
            - "null"
          format: date-time
        last_rotated_at:
          type:
            - string
            - "null"
          format: date-time
        surcharge_percent:
          type: number
          description: "Added to the instance's hourly price while dynamic IP is on."
        on_demand_used:
          type: integer
          description: "Rotate-now changes in the last 24 hours."
        on_demand_limit:
          type: integer
        failure_reason:
          type:
            - string
            - "null"
          description: "Why dynamic IP is `failed`, or why it is `degraded` while the instance uses its own address."
        events:
          type: array
          description: "Recent dynamic IP changes, newest first."
          items:
            $ref: "#/components/schemas/AddressRotationEvent"
    AddressRotationEvent:
      type: object
      required:
        - kind
        - degraded
        - occurred_at
      properties:
        kind:
          type: string
          enum:
            - enabled
            - scheduled
            - on_demand
            - failover
            - handover
            - disabled
        from_address:
          type:
            - string
            - "null"
        to_address:
          type:
            - string
            - "null"
        degraded:
          type: boolean
        occurred_at:
          type: string
          format: date-time
